name: AI 技术范式雷达

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 扫描最近多少天
        required: true
        default: "7"
        type: choice
        options:
          - "7"
          - "30"
          - "60"
          - "90"
      seed_arxiv_ids:
        description: 可选：精确补录/复查的 arXiv ID，逗号分隔
        required: false
        default: ""
        type: string
      reset_state:
        description: 忽略旧数据库，从空状态开始本轮
        required: true
        default: false
        type: boolean
      smoke_only:
        description: 只做小成本接口冒烟，不生成报告或发送邮件
        required: true
        default: true
        type: boolean
  schedule:
    # 避开整点的 Actions 高峰；使用上海时区，无需手算 UTC。
    - cron: "15 9 * * 5"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  # 恢复历史待交付后，当前 job 会在状态快照上传成功后自动排队一次本周
  # 新研究；否则一次成功的续投会静默吞掉周五研究任务。
  actions: write

concurrency:
  group: paradigm-radar-delivery
  cancel-in-progress: false

jobs:
  source-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIPELINE_MODE: paradigm
      LLM_PROVIDER: dashscope
      LLM_MODEL: qwen3.7-plus
      LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      LLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.LLM_REQUEST_TIMEOUT_SECONDS || '180' }}
      SMOKE_CHECK_TIMEOUT_SECONDS: ${{ vars.SMOKE_CHECK_TIMEOUT_SECONDS || '30' }}
      SUB_AGENT_PROVIDER: dashscope
      SUB_AGENT_MODEL: qwen3.7-plus
      SUB_AGENT_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      MAIN_AGENT_PROVIDER: dashscope
      MAIN_AGENT_MODEL: qwen3.7-plus
      MAIN_AGENT_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_ENABLED: ${{ vars.SEMANTIC_SCHOLAR_ENABLED || 'false' }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENREVIEW_VENUES: ${{ vars.OPENREVIEW_VENUES }}
      RESEARCH_FEED_URLS: ${{ vars.RESEARCH_FEED_URLS }}
      LESSWRONG_SOURCE_ENABLED: ${{ vars.LESSWRONG_SOURCE_ENABLED || 'true' }}
      LESSWRONG_KARMA_THRESHOLD: ${{ vars.LESSWRONG_KARMA_THRESHOLD || '30' }}
      ALIGNMENT_FORUM_SOURCE_ENABLED: ${{ vars.ALIGNMENT_FORUM_SOURCE_ENABLED || 'true' }}
      KOL_SOURCE_ENABLED: ${{ vars.KOL_SOURCE_ENABLED || 'true' }}
      KOL_CUSTOM_FEED_URLS: ${{ vars.KOL_CUSTOM_FEED_URLS }}
      KOL_X_SOURCE_ENABLED: ${{ vars.KOL_X_SOURCE_ENABLED || 'true' }}
      RESEARCH_WATCHLIST_MODE: ${{ vars.RESEARCH_WATCHLIST_MODE || 'merge' }}
      PRIORITY_RESEARCH_PAGES: ${{ vars.PRIORITY_RESEARCH_PAGES }}
      PRIORITY_RESEARCH_LINK_SAFETY_LIMIT: ${{ vars.PRIORITY_RESEARCH_LINK_SAFETY_LIMIT || '0' }}
      PRIORITY_RESEARCH_CONCURRENCY: ${{ vars.PRIORITY_RESEARCH_CONCURRENCY || '6' }}
      ESTABLISHED_RESEARCH_ORGANIZATIONS: ${{ vars.ESTABLISHED_RESEARCH_ORGANIZATIONS }}
      MONITORED_RESEARCH_ORGANIZATIONS: ${{ vars.MONITORED_RESEARCH_ORGANIZATIONS }}
      PRIORITY_RESEARCHERS: ${{ vars.PRIORITY_RESEARCHERS }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      TWITTER_WATCH_ACCOUNTS: ${{ vars.TWITTER_WATCH_ACCOUNTS }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_DISCOVERY_DOMAINS: ${{ vars.TAVILY_DISCOVERY_DOMAINS }}
      TAVILY_REQUEST_SAFETY_LIMIT: ${{ vars.TAVILY_REQUEST_SAFETY_LIMIT || '0' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_API_ACCESS_APPROVED: ${{ vars.REDDIT_API_ACCESS_APPROVED || 'false' }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      # 0 表示不限制；这些只是显式运行熔断，研究去留由版本化 Rubric 决定。
      PARADIGM_DISCOVERY_SAFETY_LIMIT: ${{ vars.PARADIGM_DISCOVERY_SAFETY_LIMIT || '0' }}
      PARADIGM_ANALYSIS_SAFETY_LIMIT: ${{ vars.PARADIGM_ANALYSIS_SAFETY_LIMIT || '0' }}
      PARADIGM_DEEP_SAFETY_LIMIT: ${{ vars.PARADIGM_DEEP_SAFETY_LIMIT || '0' }}
      PARADIGM_REPORT_SAFETY_LIMIT: ${{ vars.PARADIGM_REPORT_SAFETY_LIMIT || '0' }}
      PARADIGM_REFRESH_SAFETY_LIMIT: ${{ vars.PARADIGM_REFRESH_SAFETY_LIMIT || '0' }}
      SOURCING_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '7' }}
      PARADIGM_RECALL_OVERLAP_DAYS: ${{ vars.PARADIGM_RECALL_OVERLAP_DAYS || '30' }}
      PARADIGM_PRIORITY_AUTHOR_SWEEP_ENABLED: ${{ vars.PARADIGM_PRIORITY_AUTHOR_SWEEP_ENABLED || 'true' }}
      PARADIGM_MIN_SUBSTANTIVE_DISCUSSIONS: ${{ vars.PARADIGM_MIN_SUBSTANTIVE_DISCUSSIONS || '2' }}
      PARADIGM_MIN_SECONDARY_ENGAGEMENT: ${{ vars.PARADIGM_MIN_SECONDARY_ENGAGEMENT || '50' }}
      PARADIGM_BOOTSTRAP_LOOKBACK_DAYS: ${{ vars.PARADIGM_BOOTSTRAP_LOOKBACK_DAYS || '60' }}
      PARADIGM_SEED_ARXIV_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_arxiv_ids || '' }}
      PARADIGM_RESEARCHER_PROFILE_LIMIT: ${{ vars.PARADIGM_RESEARCHER_PROFILE_LIMIT || '6' }}
      PARADIGM_KEY_RESEARCHER_LIMIT: ${{ vars.PARADIGM_KEY_RESEARCHER_LIMIT || '3' }}
      # 软预算只决定本轮处理到 backlog 的哪里；Rubric 仍是唯一研究门槛。
      # 3600s 研究 + 1200s 报告，给安装、测试、邮件和 artifact 保留约 10 分钟。
      PARADIGM_RUN_BUDGET_SECONDS: ${{ vars.PARADIGM_RUN_BUDGET_SECONDS || '3600' }}
      PARADIGM_STAGE_RESERVE_SECONDS: ${{ vars.PARADIGM_STAGE_RESERVE_SECONDS || '1200' }}
      PARADIGM_DISCOVERY_SOURCE_TIMEOUT_SECONDS: ${{ vars.PARADIGM_DISCOVERY_SOURCE_TIMEOUT_SECONDS || '600' }}
      PARADIGM_REPORT_TIMEOUT_SECONDS: ${{ vars.PARADIGM_REPORT_TIMEOUT_SECONDS || '1200' }}
      PARADIGM_REPORT_REQUEST_TIMEOUT_SECONDS: ${{ vars.PARADIGM_REPORT_REQUEST_TIMEOUT_SECONDS || '360' }}
      PARADIGM_REPORT_ROUTE_CONCURRENCY: ${{ vars.PARADIGM_REPORT_ROUTE_CONCURRENCY || '2' }}
      PARADIGM_REPORT_MAX_RENDER_ATTEMPTS: ${{ vars.PARADIGM_REPORT_MAX_RENDER_ATTEMPTS || '3' }}
      PARADIGM_ANALYSIS_BATCH_SIZE: ${{ vars.PARADIGM_ANALYSIS_BATCH_SIZE || '6' }}
      PARADIGM_ORIGIN_PREFILTER_ENABLED: ${{ vars.PARADIGM_ORIGIN_PREFILTER_ENABLED || 'true' }}
      PARADIGM_TECHNICAL_REPORT_MECHANISM_SLICE: ${{ vars.PARADIGM_TECHNICAL_REPORT_MECHANISM_SLICE || '2' }}
      PARADIGM_DEEP_BATCH_SIZE: ${{ vars.PARADIGM_DEEP_BATCH_SIZE || '1' }}
      EMAIL_PUSH_ENABLED: "true"
      EMAIL_PUSH_REQUIRED: "true"
      EMAIL_MAX_ATTACHMENT_BYTES: ${{ vars.EMAIL_MAX_ATTACHMENT_BYTES || '10000000' }}
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: "465"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_USERNAME }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_USE_SSL: "true"
      SMTP_USE_STARTTLS: "false"

    steps:
      - name: 获取代码
        uses: actions/checkout@v6
        with:
          # 工作流不执行 git push，无需把临时凭据写进仓库配置；同时避免
          # post-job 清理凭据时产生非致命的 git exit 128 warning。
          persist-credentials: false
          # 生产流水线通过 HTTP Feed 工作，不依赖两个历史辅助 submodule。
          submodules: false

      - name: 准备 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 记录本轮执行代码版本
        id: provenance
        run: python -m runtime_provenance

      - name: 安装依赖
        id: dependencies
        run: |
          mkdir -p logs
          set -o pipefail
          pip install -r requirements.txt 2>&1 | tee logs/dependencies.log

      - name: 运行离线回归测试
        id: offline_checks
        run: python scripts/offline_checks.py

      - name: 配置体检
        id: doctor
        run: |
          mkdir -p logs
          set -o pipefail
          python main.py --doctor 2>&1 | tee logs/doctor.log

      - name: 恢复上一次去重状态
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_only }}
        id: restore_state
        env:
          GH_TOKEN: ${{ github.token }}
          RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || 'false' }}
        run: |
          mkdir -p logs
          exec > >(tee logs/state_restore.log) 2>&1
          if [ "$RESET_STATE" = "true" ]; then
            echo "用户要求重置状态，本轮不恢复旧数据库"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 状态使用不可变快照，避免 overwrite 先删除上一份好状态、随后上传
          # 失败时失去回滚点。兼容迁移前的同名 paradigm-radar-state artifact。
          artifact_rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.expired == false and (.name == "paradigm-radar-state" or (.name | startswith("paradigm-radar-state-"))))) | sort_by(.created_at) | reverse | .[] | [.archive_download_url, .name] | @tsv')"
          if [ -z "$artifact_rows" ]; then
            echo "未找到状态 artifact。为避免意外冷启动，请手动以 reset_state=true 初始化。"
            exit 1
          fi

          current_landscape="$(jq -r '.version' taxonomy/frontier_landscape.json)"
          restored=false
          while IFS=$'\t' read -r artifact_url artifact_name; do
            [ -n "$artifact_url" ] || continue
            candidate_dir="$(mktemp -d)"
            candidate_zip="$(mktemp)"
            echo "校验状态快照：$artifact_name"
            if ! gh api "$artifact_url" > "$candidate_zip"; then
              echo "下载失败，尝试上一份快照"
              continue
            fi
            if ! unzip -oq "$candidate_zip" -d "$candidate_dir"; then
              echo "压缩包损坏，尝试上一份快照"
              continue
            fi
            if [ ! -f "$candidate_dir/paradigm_radar.db" ]; then
              echo "快照缺少数据库，尝试上一份快照"
              continue
            fi
            state_schema="$(jq -r '.schema_version // empty' "$candidate_dir/state-meta.json" 2>/dev/null || true)"
            if ! python -m database.state_migration "$candidate_dir/paradigm_radar.db" --from-version "$state_schema"; then
              echo "数据库无法安全迁移，尝试上一份快照"
              continue
            fi
            state_landscape="$(jq -r '.landscape_version // empty' "$candidate_dir/state-meta.json" 2>/dev/null || true)"
            if [ "$state_landscape" != "$current_landscape" ]; then
              echo "前沿覆盖地图已变化：恢复旧数据库用于证据去重，并由程序补扫近 60 天新覆盖面"
            fi
            mkdir -p database
            cp "$candidate_dir/paradigm_radar.db" database/paradigm_radar.db
            echo "已从 $artifact_name 恢复并迁移跨周路线与去重状态"
            python main.py --inspect-state
            restored=true
            break
          done <<< "$artifact_rows"
          if [ "$restored" != "true" ]; then
            echo "所有未过期状态快照均不可用；拒绝静默从空状态启动"
            exit 1
          fi
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: 小成本真实接口冒烟
        id: smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_only }}
        run: python main.py --smoke-test

      - name: 抓取、分析并发送邮件
        id: pipeline
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_only }}
        run: |
          python main.py
          recovered_only="$(jq -r '.recovered_delivery_only // false' logs/pipeline_result.json)"
          echo "recovered_delivery_only=$recovered_only" >> "$GITHUB_OUTPUT"

      - name: 记录状态对应的代码版本
        id: prepare_state
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.smoke_only) }}
        run: |
          mkdir -p logs
          exec > >(tee logs/state_prepare.log) 2>&1
          if [ ! -f database/paradigm_radar.db ]; then
            echo "本轮没有产生可保存的范式数据库"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m database.state_migration database/paradigm_radar.db --from-version "$(python -m database.state_migration --print-current-version)"
          landscape_version="$(jq -r '.version' taxonomy/frontier_landscape.json)"
          state_schema="$(python -m database.state_migration --print-current-version)"
          printf '{"schema_version":%s,"landscape_version":"%s","commit_sha":"%s","run_id":"%s"}\n' "$state_schema" "$landscape_version" "$GITHUB_SHA" "$GITHUB_RUN_ID" > database/state-meta.json
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: 保存跨周去重状态
        id: upload_state
        if: ${{ always() && steps.prepare_state.outputs.available == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: paradigm-radar-state-${{ github.run_id }}
          path: |
            database/paradigm_radar.db
            database/state-meta.json
          retention-days: 90
          if-no-files-found: error

      - name: 保存本期报告
        id: upload_report
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.smoke_only) && hashFiles('reports/output/*.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: paradigm-radar-report-${{ github.run_id }}
          path: reports/output/*.md
          retention-days: 90
          if-no-files-found: error

      - name: 续投完成后排队本周新研究
        id: continuation
        if: ${{ success() && steps.pipeline.outputs.recovered_delivery_only == 'true' && steps.upload_state.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '7' }}
          SEED_ARXIV_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_arxiv_ids || '' }}
        run: |
          exec > >(tee logs/continuation.log) 2>&1
          gh workflow run weekly-radar.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f lookback_days="$LOOKBACK_DAYS" \
            -f seed_arxiv_ids="$SEED_ARXIV_IDS" \
            -f reset_state=false \
            -f smoke_only=false
          echo "历史待交付已完成并持久化；已排队新的完整研究 run"

      - name: 保存运行日志与筛选审计
        id: upload_audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paradigm-radar-audit-${{ github.run_id }}
          path: |
            logs/current_run.log
            logs/dependencies.log
            logs/runtime_provenance.json
            logs/offline_checks.log
            logs/offline_checks.json
            logs/doctor.log
            logs/state_restore.log
            logs/state_prepare.log
            logs/continuation.log
            logs/run_audit_latest.md
            logs/run_audit_latest.json
            logs/pipeline_result.json
            logs/smoke_test_latest.json
          retention-days: 90
          if-no-files-found: warn

      - name: 任一生产步骤失败邮件提醒
        if: ${{ always() && failure() && (github.event_name != 'workflow_dispatch' || !inputs.smoke_only) }}
        continue-on-error: true
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPENDENCIES_STEP_OUTCOME: ${{ steps.dependencies.outcome || 'not-run' }}
          PROVENANCE_STEP_OUTCOME: ${{ steps.provenance.outcome || 'not-run' }}
          OFFLINE_CHECKS_STEP_OUTCOME: ${{ steps.offline_checks.outcome || 'not-run' }}
          RESTORE_STATE_STEP_OUTCOME: ${{ steps.restore_state.outcome || 'not-run' }}
          DOCTOR_STEP_OUTCOME: ${{ steps.doctor.outcome || 'not-run' }}
          SMOKE_STEP_OUTCOME: ${{ steps.smoke.outcome || 'not-run' }}
          PIPELINE_STEP_OUTCOME: ${{ steps.pipeline.outcome || 'not-run' }}
          PREPARE_STATE_STEP_OUTCOME: ${{ steps.prepare_state.outcome || 'not-run' }}
          UPLOAD_STATE_STEP_OUTCOME: ${{ steps.upload_state.outcome || 'not-run' }}
          UPLOAD_REPORT_STEP_OUTCOME: ${{ steps.upload_report.outcome || 'not-run' }}
          UPLOAD_AUDIT_STEP_OUTCOME: ${{ steps.upload_audit.outcome || 'not-run' }}
          CONTINUATION_STEP_OUTCOME: ${{ steps.continuation.outcome || 'not-run' }}
          AUDIT_ARTIFACT_NAME: paradigm-radar-audit-${{ github.run_id }}
        run: python main.py --notify-failure
