name: 离线发布验收

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    # No production Secrets, model calls, SMTP, state restore, or dispatch.
    env:
      AI_RADAR_SKIP_DOTENV: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装生产依赖
        run: python -m pip install -r requirements.txt
      - name: 记录验收源码身份
        run: python -m runtime_provenance
      - name: 完整离线发布门（网络拒绝、临时状态、模拟模型与邮件）
        run: python scripts/offline_checks.py
      - name: 保存去敏离线验收证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-regression-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/runtime_provenance.json
            logs/offline_checks.json
            logs/offline_checks.log
          retention-days: 14
          if-no-files-found: warn
