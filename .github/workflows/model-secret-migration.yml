name: 临时模型 Secret 加密迁移（无模型或邮件）

on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [export, verify]

permissions:
  contents: read

jobs:
  seal:
    if: inputs.phase == 'export'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装公钥加密工具（此步骤不注入模型密钥）
        run: python -m pip install PyNaCl==1.5.0
      - name: 仅在 Runner 内用仓库公钥加密旧 Key
        env:
          OLD_MODEL_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          secret = os.environ["OLD_MODEL_KEY"]
          if not secret:
              raise SystemExit("旧模型 Secret 缺失，停止迁移")
          public_key = PublicKey(base64.b64decode("kNT7eTShggfF5Zvi6K1koW8hS2WlEbOdYfHJF8V+/k8="))
          encrypted = base64.b64encode(SealedBox(public_key).encrypt(secret.encode())).decode()
          Path("ciphertext.json").write_text(json.dumps({"key_id": "3380204578043523366", "encrypted_value": encrypted}))
          print("已生成仅 GitHub 可解密的迁移密文；未输出明文或摘要")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: model-secret-migration-ciphertext
          path: ciphertext.json
          retention-days: 1
  verify:
    if: inputs.phase == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证 MAIN/SUB 新 Secret 与旧 Key 一致（不请求模型）
        env:
          OLD_MODEL_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SUB_MODEL_KEY: ${{ secrets.SUB_AGENT_LLM_API_KEY }}
          MAIN_MODEL_KEY: ${{ secrets.MAIN_AGENT_LLM_API_KEY }}
        run: |
          python3 - <<'PY'
          import hmac, os
          old = os.environ["OLD_MODEL_KEY"].encode()
          if not old or not all(hmac.compare_digest(old, os.environ[name].encode()) for name in ("SUB_MODEL_KEY", "MAIN_MODEL_KEY")):
              raise SystemExit("新 Secret 迁移核验失败；保留旧 Key")
          print("MAIN/SUB Secret 复制核验通过；未输出密钥、长度或摘要")
          PY
